<style>

body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);

 padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(7,19,56,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .logo{width:34px;height:34px;border-radius:10px;background:var(--glow);display:grid;place-items:center;font-size:1.1rem;box-shadow:0 4px 18px rgba(75,107,255,.5)}
header h1{flex:1;margin:0;font-size:1.1rem;font-weight:700;letter-spacing:.2px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-size:1.1rem;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px 14px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--act);border-color:transparent}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.rc{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:none;padding:0}
.emo{font-size:1.4rem;width:44px;height:44px;display:grid;place-items:center;background:var(--glass2);border-radius:13px;flex:none}
.rc .t{flex:1;min-width:0}.rc b{display:block}.muted{color:var(--muted)}.small{font-size:.84rem}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin:5px 6px 0 0;letter-spacing:.3px}
.g-disinfects{color:var(--ok)}.g-sanitizes{color:var(--warn)}.g-cleans{color:var(--muted)}.g-pest{color:#c9a7ff}
h2{font-size:1.02rem;margin:20px 0 6px}
ol,ul{padding-left:22px;margin:6px 0}li{margin:4px 0}
.note{border-radius:14px;padding:12px 14px;margin:12px 0;background:rgba(245,197,66,.08);border:1px solid rgba(245,197,66,.35)}
.danger{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.4)}
.back{background:none;border:none;color:var(--accent);font:inherit;padding:6px 0;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit;cursor:pointer}
.btn.primary{background:var(--act);border-color:transparent;font-weight:600}
.wide{width:100%}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catcard{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.catcard .ce{font-size:1.6rem;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--glass2);margin-bottom:4px}
.catcard b{font-size:.95rem;line-height:1.25}
table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}
.mix{display:flex;gap:10px}
.pantry{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pantry label{display:flex;gap:8px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;font-size:.88rem}
.pantry input{accent-color:#2fa8ff}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:rgba(7,19,56,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-size:.72rem;padding:8px 0 10px;cursor:pointer}
nav button span{display:block;font-size:1.25rem}nav button.on{color:#fff;font-weight:600}nav button.on span{filter:drop-shadow(0 0 8px rgba(47,168,255,.8))}
a{color:var(--accent)}
.fav{background:none;border:none;font-size:1.35rem;cursor:pointer;color:#ff7ab8}
.sec{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;margin:4px 0}.sec .k{color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.6px;padding-top:3px}
details.help{background:var(--glass);border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:10px 14px}
details.help summary{cursor:pointer;font-weight:600;list-style:none}details.help summary::-webkit-details-marker{display:none}
details.help p{margin:8px 0 2px;line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.stat b{display:block;font-size:1.05rem}
.glowtext{background:var(--glow);-webkit-background-clip:text;background-clip:text;color:transparent}
@media print{nav,header,.back,.noprint{display:none}body{background:#fff;color:#000}.card{border:1px solid #999;background:none}}
</style>
</head>
<body>
<header><div class="logo">🧴</div><h1>DIY Cleaners</h1><button class="iconbtn" data-tab="menu" aria-label="Menu">☰</button></header>
<main id="app"><p class="muted">Loading recipes…</p></main>
<nav id="nav">
 <button data-tab="recipes" class="on"><span>🧽</span>Recipes</button>
 <button data-tab="pantry"><span>🧺</span>What can I make?</button>
 <button data-tab="safety"><span>⚠️</span>Safety</button>
 <button data-tab="saved"><span>♥</span>Saved</button>
</nav>
<script>
/* Release info: bump VERSION per release and BUILD per published build (Build Directive) */
const VERSION="1.1.1",BUILD="2026.11.17-2";
const CHANGES=[["1.1.1","Recipes open by category; the all-recipes list is gone, and the never-mix banner is back"],["1.1.0","269 recipes: the 250 from the VYBEON Clean book merged with the library (24 duplicates combined, 1 left out), VYBEON look, About and Help"],["1.0.0","First release: 44 recipes, safety tab, What can I make?"]];
const GERM={disinfects:["DISINFECT","Kills most germs when made and used exactly as written: a public-health bleach dilution with its full wet contact time, on a surface you cleaned first."],
 sanitizes:["SANITIZE","Reduces germs to safe levels using a published public-health method (bleach dilution, boiling, or a hot wash and dry)."],
 cleans:["CLEANS ONLY","Removes dirt, grease and odor. It makes no germ-kill claim. When someone is sick, follow with a recipe marked Sanitize or Disinfect."],
 pest:["PEST CONTROL","For insects. Not a cleaner, sanitizer or disinfectant."]};
const PANTRY=[["vinegar","White vinegar",/white (distilled )?vinegar|cleaning vinegar|\bvinegar\b(?!.*cider)/],["bakingsoda","Baking soda",/baking soda/],["washingsoda","Washing soda",/washing soda/],
 ["dishsoap","Dish soap",/dish soap|dishwashing liquid/],["castile","Castile soap",/castile/],["detergent","Laundry detergent",/detergent/],["peroxide","3% hydrogen peroxide",/peroxide/],
 ["alcohol","Rubbing alcohol",/isopropyl|rubbing alcohol|vodka/],["oxygen","Oxygen bleach",/oxygen bleach|percarbonate/],["bleach","Unscented bleach",/(?<!oxygen )\bbleach\b/],
 ["salt","Salt",/\bsalt\b/],["cornstarch","Cornstarch",/cornstarch/],["citrus","Lemons / limes",/lemon|lime\b|limes|orange/],["oil","Cooking oil",/vegetable oil|olive oil|coconut oil|cooking oil|mineral oil/],
 ["citric","Citric acid",/citric acid/],["borax","Borax",/borax/],["acv","Apple cider vinegar",/apple cider/],["eo","Essential oils",/essential oil/],["de","Diatomaceous earth",/diatomaceous/]];
const NEVERMIX=[["Bleach + vinegar, lemon or any acid","Chlorine gas: severe lung and eye injury"],["Bleach + ammonia (some glass cleaners, urine)","Chloramine gases: coughing, chest pain, lung damage"],
 ["Bleach + rubbing alcohol","Chloroform and other toxic compounds"],["Bleach + hydrogen peroxide","Violent oxygen release and splashing"],["Hydrogen peroxide + vinegar in one bottle","Peracetic acid, corrosive to skin, eyes and lungs"],
 ["Bleach + toilet-bowl or drain cleaner","Chlorine gas or heat: toxic fumes, splattering"],["Two different drain cleaners","Heat, pressure and splashing: chemical burns"],["Baking soda + vinegar in a capped bottle","Pressure can burst it, and the mix cancels out; combine only at the point of use"]];
const DILUTIONS=[["Sanitize food-contact surfaces","1 Tbsp","1 gal cool water","Wet 1 min, rinse, air-dry"],["Sanitize (small batch)","1 tsp","1 qt cool water","Wet 1 min, rinse, air-dry"],
 ["Sanitize infant feeding items","2 tsp","1 gal water","Soak 2 min, don't rinse"],["Sponges and dishcloths","3/4 cup","1 gal water","Soak 5 min, rinse"],["Disinfect household surfaces","5 Tbsp (1/3 cup)","1 gal room-temp water","Wet 1 min+"],
 ["Disinfect (small batch)","4 tsp","1 qt room-temp water","Wet 1 min+"],["Disinfect pet bowls, toys, boxes","1/4 cup","1 gal water","Wet 10 min+, rinse, dry"]];
const SOURCES=[["CDC: Cleaning and disinfecting with bleach","https://www.cdc.gov/hygiene/about/cleaning-and-disinfecting-with-bleach.html"],["CDC: When and how to clean and disinfect your home","https://www.cdc.gov/hygiene/about/when-and-how-to-clean-and-disinfect-your-home.html"],
 ["CDC Healthy Pets: Cleaning pet supplies","https://www.cdc.gov/healthy-pets/about/cleaning-and-disinfecting-pet-supplies.html"],["CDC: Infant feeding items","https://www.cdc.gov/hygiene/about/clean-sanitize-store-infant-feeding-items.html"],
 ["EPA: Six steps for safe disinfectant use","https://www.epa.gov/coronavirus/six-steps-safe-effective-disinfectant-use"],["EPA: Household substances","https://www.epa.gov/coronavirus-and-disinfectants/can-i-use-common-household-substances-kill-novel-coronavirus"],
 ["USDA: Clean, then sanitize","https://www.usda.gov/media/blog/2019/08/27/clean-then-sanitize-one-two-punch-stop-foodborne-illness-kitchen"],["ASPCA: Poisonous household products","https://www.aspca.org/pet-care/aspca-poison-control/poisonous-household-products"],
 ["U. of Illinois Extension: Clean and sanitize the kitchen","https://extension.illinois.edu/food/cleaning-kitchen"],["Virginia Tech Extension: Hand sanitizers","https://pubs.ext.vt.edu/FST/FST-407/FST-407.html"]];
const HELP=[["🔎","Finding a recipe","Pick a category (Kitchen, Bathroom, Glass and mirrors and so on) to see its recipes, or type in the search box: a surface, a stain, an ingredient or a number like 112. Tap a recipe to open it."],
 ["🏷️","What the labels mean","CLEANS ONLY removes dirt, grease and odor, with no germ-kill claim. SANITIZE reduces germs to safe levels using a published public-health method. DISINFECT kills most germs when made exactly as written. Clean first, then sanitize or disinfect."],
 ["📖","Reading a recipe","Each recipe lists ingredients with amounts, how to prepare it, how to apply it, its limits (surfaces and materials to avoid), and storage. Read the limits before you start, and test a hidden spot."],
 ["🧺","What can I make?","Tick what's in your cupboard. Water is always assumed. You'll see what you can mix now, and what needs just one more item."],
 ["⚠️","Safety","Never mix bleach with anything but water. Use one product at a time and rinse between products. Open the Safety tab for the never-mix chart, bleach dilutions and emergency numbers."],
 ["♥","Saving and printing","Tap ♡ on a recipe to keep it in Saved. Use Print label to print the recipe for the bottle."],
 ["📲","Install and offline","Add it to your Home Screen to open it like an app: in Safari tap Share, then Add to Home Screen; in Chrome tap ⋮, then Install app. After your first visit it works without a signal."],
 ["💾","Your data","Saved recipes and your cupboard list stay in this browser on this device. Nothing is sent anywhere."]];
const KEY="diy-cleaning-v1";let S={saved:[],have:[]};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let D=null,tab="recipes",cat=null,q="",open=null,limit=60;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(3,"0"),catOf=id=>D.categories.find(c=>c.id===id);
const badge=r=>`<span class="badge g-${r.germ}">${GERM[r.germ][0]}</span>`;
const card=(r,extra="")=>`<div class="card"><button class="rc" data-open="${r.no}"><div class="emo">${catOf(r.cat).emo}</div><div class="t"><b>${esc(r.name)}</b><span class="muted small">#${pad(r.no)} · ${catOf(r.cat).name}</span>${extra}<br>${badge(r)}</div><span class="muted">›</span></button></div>`;
const hay=r=>(r._h=r._h||[pad(r.no),String(r.no),r.name,r.apply,...r.ing].join(" ").toLowerCase());
function matches(){const t=q.trim().toLowerCase();return D.recipes.filter(r=>(!cat||r.cat===cat)&&(!t||t.split(/\s+/).every(w=>hay(r).includes(w))))}
function grid(){return `<div class="cats">${D.categories.map(c=>`<button class="catcard" data-cat="${c.id}"><span class="ce">${c.emo}</span><b>${c.name}</b><span class="muted small">${D.recipes.filter(r=>r.cat===c.id).length} recipes</span></button>`).join("")}</div>`}
function listHTML(){if(!cat&&!q.trim())return grid();const rs=matches();return (rs.slice(0,limit).map(r=>card(r)).join("")||`<p class="muted">No recipes match “${esc(q)}”.</p>`)+
  (rs.length>limit?`<button class="btn wide" data-more>Show more (${rs.length-limit} left)</button>`:"")}
function list(){
  const c=cat&&catOf(cat);
  return (c?`<button class="back" data-cat="">‹ Categories</button><h2 style="margin:2px 0 10px">${c.emo} ${c.name} <span class="muted small">· ${D.recipes.filter(r=>r.cat===cat).length}</span></h2>`
   :`<div class="note danger small"><b>Never mix bleach with vinegar,</b> ammonia, alcohol, peroxide or any other cleaner. Bleach mixes only with water. <a href="#safety" data-tab="safety">Never-mix chart</a></div>`)+
  `<input class="search" id="q" type="search" placeholder="${c?`Search ${c.name}`:`Search all ${D.recipes.length} recipes`}" value="${esc(q)}" aria-label="Search recipes">
  <div id="list" style="margin-top:10px">${listHTML()}</div>`;
}
function detail(r){
  const c=catOf(r.cat),fav=S.saved.includes(r.no);
  const row=(k,v)=>`<div class="sec"><div class="k">${k}</div><div>${v}</div></div>`;
  return `<button class="back" data-back>‹ Back</button>
  <div class="card"><div class="rc" style="cursor:default"><div class="emo">${c.emo}</div><div class="t"><span class="muted small">#${pad(r.no)} · ${c.name}</span><h2 style="margin:2px 0;font-size:1.2rem">${esc(r.name)}</h2>${badge(r)}</div>
  <button class="fav noprint" data-fav="${r.no}" aria-label="${fav?"Remove from saved":"Save"}">${fav?"♥":"♡"}</button></div>
  <p class="small muted" style="margin:8px 0 0">${GERM[r.germ][1]}</p></div>
  ${r.germ==="disinfects"||r.germ==="sanitizes"?`<div class="note danger small"><b>Bleach mixes only with water.</b> Never add vinegar, lemon, ammonia, alcohol, peroxide or any other cleaner.</div>`:""}
  <div class="card">
  ${row("INGREDIENTS",`<ul style="margin:0">${r.ing.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`)}
  ${row("PREPARE",esc(r.prepare))}${row("APPLY",esc(r.apply))}
  ${row("LIMITS",`<ul style="margin:0">${r.limits.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`)}
  ${row("STORAGE",esc(r.storage))}</div>
  <div class="noprint" style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="window.print()">🖨 Print label</button><button class="btn" data-tab="safety">⚠️ Never-mix chart</button></div>
  <p class="small muted">${r.src==="book"?"From VYBEON Clean: 250 DIY Household Cleaning Recipes.":"From the DIY Cleaners recipe library."} Test a hidden spot first and label every container with contents and date.</p>`;
}
function pantry(){
  const have=new Set(S.have),ok=D.recipes.filter(r=>r.needs.length&&r.needs.every(n=>have.has(n))),near=D.recipes.filter(r=>!ok.includes(r)&&r.needs.filter(n=>!have.has(n)).length===1);
  const nm=Object.fromEntries(PANTRY.map(p=>[p[0],p[1]]));
  return `<h2 style="margin-top:6px">What do you have?</h2><p class="small muted">Tick what's in your cupboard. Water is always assumed.</p>
  <div class="pantry">${PANTRY.map(([k,v])=>`<label><input type="checkbox" data-have="${k}" ${have.has(k)?"checked":""}> ${v}</label>`).join("")}</div>
  <h2>You can make now <span class="muted small">· ${ok.length}</span></h2>${ok.slice(0,80).map(r=>card(r)).join("")||`<p class="muted small">Tick a few ingredients to see recipes.</p>`}
  ${near.length?`<h2>One ingredient away <span class="muted small">· ${near.length}</span></h2>`+near.slice(0,40).map(r=>card(r,`<br><span class="small" style="color:var(--warn)">Need: ${r.needs.filter(n=>!have.has(n)).map(n=>nm[n]).join(", ")}</span>`)).join(""):""}`;
}
function safety(){
  return `<div class="note danger"><b>NEVER MIX BLEACH WITH VINEGAR,</b> or with ammonia, alcohol, peroxide, acids or any other cleaner. Bleach mixes only with water.</div>
  <h2>Never-mix chart</h2>${NEVERMIX.map(([a,b])=>`<div class="card mix"><div>🚫</div><div><b>${a}</b><div class="small muted">${b}</div></div></div>`).join("")}
  <h2>What really kills germs</h2>
  <p class="small">Vinegar, lemon, baking soda, washing soda, salt, dish soap and essential oils clean, but they do not disinfect. No vinegar product is EPA-registered as a disinfectant. Only the bleach dilutions below (or an EPA-registered disinfectant used exactly as labeled) sanitize or disinfect, and only on a surface you cleaned first.</p>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th>Purpose</th><th>Bleach</th><th>Water</th><th>Contact</th></tr></thead>
  <tbody>${DILUTIONS.map(r=>`<tr>${r.map((c,i)=>`<td>${i?c:`<b>${c}</b>`}</td>`).join("")}</tr>`).join("")}</tbody></table>
  <p class="small muted" style="margin:8px 0 0">Use regular, unscented bleach labeled 5 to 9% sodium hypochlorite. Make it fresh daily. If the bottle has its own directions, follow the bottle.</p></div>
  <h2>Ground rules</h2><ul class="small">
  <li>One product at a time. Rinse and let dry before switching, and wait 24 hours after any drain product.</li>
  <li>Open windows or run a fan. Gloves always; eye protection with bleach and washing soda.</li>
  <li>Label every container with contents and date. Never reuse food or drink bottles.</li>
  <li>Keep pets out until surfaces are rinsed and dry. Birds are very sensitive to fumes. No essential oils in pet areas.</li>
  <li>Never put cleaners on skin or on pets. Wash your hands for 20 seconds after cleaning.</li></ul>
  <h2>Emergency numbers</h2>
  <div class="card small">People, Poison Help (US): <a href="tel:18002221222">1-800-222-1222</a><br>Pets, ASPCA Animal Poison Control: <a href="tel:18884264435">(888) 426-4435</a><br>Life-threatening emergency: <a href="tel:911">911</a></div>
  <p class="small muted">Sources: ${SOURCES.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join(" · ")}</p>`;
}
function saved(){const rs=D.recipes.filter(r=>S.saved.includes(r.no));return `<h2 style="margin-top:6px">Saved recipes</h2>${rs.map(r=>card(r)).join("")||`<p class="muted">Tap ♡ on a recipe to keep it here.</p>`}`}
function menu(){return `<h2 style="margin-top:6px">Menu</h2>
  <div class="card"><button class="rc" data-tab="help"><div class="emo">❓</div><div class="t"><b>Help</b><span class="muted small">How each part of the app works</span></div><span class="muted">›</span></button></div>
  <div class="card"><button class="rc" data-tab="about"><div class="emo">ℹ️</div><div class="t"><b>About</b><span class="muted small">Version ${VERSION}, recipe sources and what's new</span></div><span class="muted">›</span></button></div>`}
function help(){return `<button class="back" data-tab="menu">‹ Menu</button><h2 style="margin-top:4px">Help</h2>`+
  HELP.map(([e,t,a],i)=>`<details class="help" name="help" ${i===0?"open":""}><summary>${e} ${t}</summary><p class="small">${a}</p></details>`).join("")}
function about(){const m=D.merge,cnt=g=>D.recipes.filter(r=>r.germ===g).length;
  return `<button class="back" data-tab="menu">‹ Menu</button>
  <div style="text-align:center;margin:10px 0 14px"><div class="logo" style="width:72px;height:72px;margin:0 auto;border-radius:20px;background:var(--glow);display:grid;place-items:center;font-size:2.2rem;box-shadow:0 10px 34px rgba(124,77,255,.5)">🧴</div>
  <h2 class="glowtext" style="font-size:1.5rem;margin:12px 0 2px">DIY Cleaners</h2><div class="muted small">Safe cleaners you mix at home</div></div>
  <div class="stats"><div class="stat"><span class="muted small">Version</span><b>${VERSION}</b></div><div class="stat"><span class="muted small">Build</span><b>${BUILD}</b></div></div>
  <h2>Recipes · ${D.recipes.length}</h2>
  <div class="card small">${cnt("cleans")} cleans only · ${cnt("sanitizes")} sanitize · ${cnt("disinfects")} disinfect · ${cnt("pest")} pest control<br>
  <span class="muted">${D.recipes.filter(r=>r.src==="book").length} from <i>VYBEON Clean: 250 DIY Household Cleaning Recipes</i>, plus ${m.library_kept.length} from the DIY Cleaners library. ${m.duplicates.length} library recipes matched book recipes and were combined. ${m.left_out.length} left out for safety.</span></div>
  <h2>What's new</h2>${CHANGES.map(([v,t],i)=>`<div class="card small"><span class="badge ${i?"g-cleans":"g-disinfects"}" style="margin:0 8px 0 0">${v}</span>${t}</div>`).join("")}
  <h2>Privacy</h2><p class="small">Everything you save stays in this browser on this device. Nothing is sent anywhere.</p>
  <p class="small muted">Homemade cleaners aren't lab-tested. This app is general household information, not medical, veterinary or professional advice. Follow product labels and manufacturer instructions.</p>
  <p class="small muted" style="text-align:center">Version ${VERSION} · Build ${BUILD} · <a href="https://github.com/MichaelGaylan/DIY-cleaners" target="_blank" rel="noopener">Source on GitHub</a></p>`}
function draw(){
  if(!D)return;const r=open&&D.recipes.find(x=>x.no===open);
  $("#app").innerHTML=r?detail(r):tab==="pantry"?pantry():tab==="safety"?safety():tab==="saved"?saved():tab==="menu"?menu():tab==="help"?help():tab==="about"?about():list();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",!open&&b.dataset.tab===tab));
  const qi=$("#q");if(qi)qi.oninput=e=>{q=e.target.value;limit=60;$("#list").innerHTML=listHTML()};
  document.querySelectorAll("details.help").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)document.querySelectorAll("details.help").forEach(o=>{if(o!==d)o.open=false})}));
}
function go(hash){history.pushState({},"",hash);fromHash();scrollTo(0,0)}
document.addEventListener("click",e=>{
  const k=e.target.closest("[data-open],[data-tab],[data-cat],[data-back],[data-fav],[data-more]");if(!k)return;const d=k.dataset;
  if(d.open){go("#"+pad(d.open));return}
  if(d.tab){e.preventDefault();if(d.tab==="recipes"&&tab==="recipes"&&!open){cat=null;q=""}go("#"+d.tab);return}
  if(d.cat!==undefined){cat=d.cat||null;q="";limit=60;draw();scrollTo(0,0);return}
  if(d.more!==undefined){limit+=60;$("#list").innerHTML=listHTML();return}
  if(d.back!==undefined){go("#"+tab);return}
  if(d.fav){const n=+d.fav;S.saved=S.saved.includes(n)?S.saved.filter(x=>x!==n):[...S.saved,n];save();draw()}
});
document.addEventListener("change",e=>{const h=e.target.dataset.have;if(!h)return;S.have=e.target.checked?[...new Set([...S.have,h])]:S.have.filter(x=>x!==h);save();draw()});
function fromHash(){const h=location.hash.slice(1);if(/^\d{3}$/.test(h)){open=+h}else{open=null;if(["recipes","pantry","safety","saved","menu","help","about"].includes(h))tab=h;else if(!h)tab="recipes"}draw()}
addEventListener("popstate",fromHash);
fetch("data/recipes.json").then(r=>r.json()).then(j=>{D=j;
  D.recipes.forEach(r=>{r.needs=PANTRY.filter(([k,,re])=>r.ing.some(i=>!/optional/i.test(i)&&re.test(i.toLowerCase()))).map(p=>p[0])});
  S.saved=(S.saved||[]).filter(x=>typeof x==="number");fromHash()}).catch(()=>{$("#app").innerHTML=`<p>Couldn't load recipes. Check your connection and reload.</p>`});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
