    return `<button class="back" data-pc="">‹ What can I make?</button><h2 style="margin:2px 0 4px;display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px">${ic(id)}</span>${c.name} <span class="muted small">· ${rs.length}</span></h2>
    <p class="small muted" style="margin:0">${kind==="ok"?"You can make these now":"One ingredient away"}</p>${rs.map(r=>card(r,kind==="ok"?"":needLine(r))).join("")||`<p class="muted small">Nothing here now. Go back and tick more ingredients.</p>`}`}
  return `<h2 style="margin-top:6px">What do you have?</h2><p class="small muted">Tick what's in your cupboard. Water is always assumed. Prices are typical US prices (${D.prices.as_of}).</p>

  <h2>You can make now <span class="muted small">· ${ok.length}</span></h2>${ok.length?catGrid(ok,id=>`data-pc="ok:${id}"`):`<p class="muted small">Tick a few ingredients to see recipes.</p>`}
  ${near.length?`<h2>One ingredient away <span class="muted small">· ${near.length}</span></h2>`+catGrid(near,id=>`data-pc="near:${id}"`):""}`;
}
function safety(){
  return `<div class="note danger"><b>NEVER MIX BLEACH WITH VINEGAR,</b> or with ammonia, alcohol, peroxide, acids or any other cleaner. Bleach mixes only with water.</div>
  <h2>Never-mix chart</h2>${NEVERMIX.map(([a,b])=>`<div class="card mix"><span class="mi">${ic("nevermix")}</span><div><b>${a}</b><div class="small muted">${b}</div></div></div>`).join("")}
  <h2>What really kills germs</h2>
  <p class="small">Vinegar, lemon, baking soda, washing soda, salt, dish soap and essential oils clean, but they do not disinfect. No vinegar product is EPA-registered as a disinfectant. Only the bleach dilutions below (or an EPA-registered disinfectant used exactly as labeled) sanitize or disinfect, and only on a surface you cleaned first.</p>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th>Purpose</th><th>Bleach</th><th>Water</th><th>Contact</th></tr></thead>
  <tbody>${DILUTIONS.map(r=>`<tr>${r.map((c,i)=>`<td>${i?c:`<b>${c}</b>`}</td>`).join("")}</tr>`).join("")}</tbody></table>
  <p class="small muted" style="margin:8px 0 0">Use regular, unscented bleach labeled 5 to 9% sodium hypochlorite. Make it fresh daily. If the bottle has its own directions, follow the bottle.</p></div>
  <h2>Ground rules</h2><ul class="small">
  <li>One product at a time. Rinse and let dry before switching, and wait 24 hours after any drain product.</li>
  <li>Open windows or run a fan. Gloves always; eye protection with bleach and washing soda.</li>
  <li>Label every container with contents and date. Never reuse food or drink bottles.</li>
  <li>Keep pets out until surfaces are rinsed and dry. Birds are very sensitive to fumes. No essential oils in pet areas.</li>
  <li>Never put cleaners on skin or on pets. Wash your hands for 20 seconds after cleaning.</li></ul>
  <h2>Emergency numbers</h2>
  <div class="card small">People, Poison Help (US): <a href="tel:18002221222">1-800-222-1222</a><br>Pets, ASPCA Animal Poison Control: <a href="tel:18884264435">(888) 426-4435</a><br>Life-threatening emergency: <a href="tel:911">911</a></div>
  <p class="small muted">Sources: ${SOURCES.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join(" · ")}</p>
  ${gate?`<div class="card accept" id="accept"><b>Do you accept these safety warnings?</b><p class="small">By tapping Accept you confirm you have read this page and will never mix bleach with ammonia, acids, alcohol, peroxide or any other cleaner. You can't use DIY Cleaners until you accept.</p>
  <div style="display:flex;gap:8px"><button class="btn primary" style="flex:1" data-accept>OK, I accept</button><button class="btn" style="flex:1;justify-content:center" data-decline>Decline</button></div></div>`
  :`<p class="small muted">You accepted these warnings on ${new Date(S.accepted).toLocaleDateString()}.</p>`}`;
}
function saved(){const rs=D.recipes.filter(r=>S.saved.includes(r.no));return `<h2 style="margin-top:6px">Saved recipes</h2>${rs.map(r=>card(r)).join("")||`<p class="muted">Tap ♡ on a recipe to keep it here.</p>`}`}
const row=(icon,title,sub,attr)=>`<div class="card"><${attr.startsWith("href")?"a":"button"} class="rc" ${attr} style="text-decoration:none"><div class="emo">${ic(icon)}</div><div class="t"><b>${title}</b><span class="muted small">${sub}</span></div><span class="muted">›</span></${attr.startsWith("href")?"a":"button"}></div>`;
function settings(){return `<h2 style="margin-top:6px">Settings</h2>
  <h2 style="font-size:.9rem;margin-top:12px" class="muted">COLOR THEME</h2>
  <div class="themes" id="themes"><div class="bub"></div>${THEMES.map(t=>`<button class="th${t.id===S.theme?" on":""}" data-theme="${t.id}"><span class="sw">${t.sw.map(c=>`<i style="background:${c}"></i>`).join("")}</span><b>${t.name}</b><span class="muted small" style="margin-top:-4px">${t.mode==="dark"?"Dark":"Light"}</span></button>`).join("")}</div>
  <h2 style="font-size:.9rem;margin-top:18px" class="muted">MORE</h2>
  ${row("help","Help","How each part of the app works",'data-tab="help"')}
  ${row("nevermix","Report a problem","Opens a pre-filled email to VYBEON",`href="${report()}"`)}
  ${row("safety","Safety warnings","Read the never-mix chart again",'data-tab="safety"')}
  ${row("about","About",`Version ${VERSION}, recipe sources and what's new`,'data-tab="about"')}
  ${savingsCard()}<button class="btn wide" style="justify-content:center" data-reset>${resetArm?"Tap again to reset savings to $0.00":"Reset savings"}</button>
  ${S.noBanner&&!standalone()?`<button class="btn wide" style="justify-content:center;margin-top:8px" data-showbanner>Show the Home Screen tip again</button>`:""}`}
let resetArm=false;
function help(){return `<button class="back" data-tab="settings">‹ Settings</button><h2 style="margin-top:4px">Help</h2>`+
  HELP.map(([e,t,a],i)=>`<details class="help" name="help" ${i===0?"open":""}><summary><span class="hi">${ic(e)}</span>${t}</summary><p class="small">${a}</p></details>`).join("")}
function about(){const m=D.merge,cnt=g=>D.recipes.filter(r=>r.germ===g).length;
  return `<button class="back" data-tab="settings">‹ Settings</button>
  <div style="text-align:center;margin:10px 0 14px"><div style="width:76px;height:76px;margin:0 auto;filter:drop-shadow(0 10px 30px rgba(124,77,255,.45))">${ic("logo")}</div>
  <h2 class="glowtext" style="font-size:1.5rem;margin:12px 0 2px">DIY Cleaners</h2><div class="muted small">Safe cleaners you mix at home</div></div>
  <div class="stats"><div class="stat"><span class="muted small">Version</span><b>${VERSION}</b></div><div class="stat"><span class="muted small">Build</span><b>${BUILD}</b></div></div>
  <h2>Recipes · ${D.recipes.length}</h2>
  <div class="card small">${cnt("cleans")} cleans only · ${cnt("sanitizes")} sanitize · ${cnt("disinfects")} disinfect · ${cnt("pest")} pest control<br>
  <span class="muted">${D.recipes.filter(r=>r.src==="book").length} from <i>VYBEON Clean: 250 DIY Household Cleaning Recipes</i>, plus ${m.library_kept.length} from the DIY Cleaners library. ${m.duplicates.length} library recipes matched book recipes and were combined. ${m.left_out.length} left out for safety.</span></div>
  <h2>What's new</h2>${CHANGES.map(([v,t],i)=>`<div class="card small"><span class="badge ${i?"g-cleans":"g-disinfects"}" style="margin:0 8px 0 0">${v}</span>${t}</div>`).join("")}
  <h2>Prices</h2><p class="small muted">${D.prices.note} Ingredient prices are as of ${D.prices.as_of}. Store-bought comparisons use typical ready-to-use prices per ounce for each kind of product, or a diluted store concentrate for bucket and soak-size batches. ${D.recipes.filter(r=>r.cost!=null).length} of ${D.recipes.length} recipes have a cost estimate; the rest use “label amount” products or tools only.</p>
  <h2>Privacy</h2><p class="small">Everything you save stays in this browser on this device. Nothing is sent anywhere.</p>
  <p class="small muted">Homemade cleaners aren't lab-tested. This app is general household information, not medical, veterinary or professional advice. Follow product labels and manufacturer instructions.</p>
  <p class="small muted" style="text-align:center">© 2026 Michael Gaylan (VYBEON). All rights reserved.</p>
  <p class="small muted" style="text-align:center">Version ${VERSION} · Build ${BUILD} · <a href="${REPO}" target="_blank" rel="noopener">Source on GitHub</a></p>`}
/* Overlays: safety gate (MAKE-013) and ammonia warning (MAKE-017) */
function overlay(){const o=$("#ov");let h="";
  if(gate==="popup")h=`<div class="box"><div class="bi">${ic("safety")}</div><h2>Before you start</h2>
   <p>Mixing some household chemicals can release gases that are <b>life threatening</b>. Before you use DIY Cleaners, you need to read the safety warnings about these chemicals and how they react.</p>
   <p class="small muted">Tap OK to open the Safety page. At the bottom, tap Accept to start using the app.</p><div class="acts"><button class="btn primary" data-gate-ok>OK</button></div></div>`;
  else if(gate==="declined")h=`<div class="box"><div class="bi">${ic("nevermix")}</div><h2>DIY Cleaners is locked</h2>
   <p>You declined the safety warning, so the app can't be used. Mixing the wrong chemicals can be life threatening, and every recipe depends on knowing which ones never go together.</p>
   <p class="small muted">You can close this tab now, or read the warning again.</p><div class="acts"><button class="btn primary" data-gate-again>Show the warning again</button></div></div>`;
  else if(amm)h=`<div class="box"><div class="bi">${ic("nevermix")}</div><h2>Ammonia: extra caution</h2>
   <p><b>Never mix ammonia with bleach</b> or anything that contains bleach. Together they make chloramine gas, which can cause coughing, chest pain and lung damage.</p>
   <ul class="small"><li>Some glass cleaners contain ammonia, and so does urine. Never use bleach on pet urine or right after an ammonia cleaner.</li>
   <li>Use one product at a time, with windows open. Wear gloves.</li><li>Store ammonia away from bleach, and never in a food or drink bottle.</li>
   <li>None of the recipes in this app use ammonia, so ticking it won't unlock any recipes.</li></ul>
   <div class="acts"><button class="btn primary" data-amm="yes">I understand, add ammonia</button><button class="btn" style="justify-content:center" data-amm="no">Cancel</button></div></div>`;
  o.innerHTML=h;o.hidden=!h;document.body.classList.toggle("locked",!!gate);document.body.style.overflow=h?"hidden":"";
  if(h){const b=o.querySelector(".btn");b&&b.focus()}}
let amm=false;
/* Liquid glass bubbles (MAKE-011): stretch toward the target, then spring into place */
const RM=matchMedia("(prefers-reduced-motion: reduce)");
function slide(bub,target,box){if(!bub||!target)return;const p=box.getBoundingClientRect(),t=target.getBoundingClientRect();
  const n={l:t.left-p.left,t:t.top-p.top,w:t.width,h:t.height},o=bub._p;bub._p=n;
  Object.assign(bub.style,{left:n.l+"px",top:n.t+"px",width:n.w+"px",height:n.h+"px"});
  if(!o||RM.matches||(o.l===n.l&&o.t===n.t))return;
  const sl=Math.min(o.l,n.l),st=Math.min(o.t,n.t),sw=Math.max(o.l+o.w,n.l+n.w)-sl,sh=Math.max(o.t+o.h,n.t+n.h)-st;
  bub.animate([{left:o.l+"px",top:o.t+"px",width:o.w+"px",height:o.h+"px"},{left:sl+"px",top:st+"px",width:sw+"px",height:sh+"px",offset:.35,easing:"cubic-bezier(.34,1.56,.64,1)"},{left:n.l+"px",top:n.t+"px",width:n.w+"px",height:n.h+"px"}],{duration:560,easing:"ease-out"})}
function bubbles(){slide($("nav .bub"),$("nav button.on"),$("nav .in"));if(!$("nav button.on"))$("nav .bub").style.opacity=0;else $("nav .bub").style.opacity=1;
  const th=$("#themes");if(th)slide(th.querySelector(".bub"),th.querySelector(".th.on"),th)}
function drop(el,e){if(RM.matches||!el.animate)return;const r=el.getBoundingClientRect(),d=document.createElement("span"),s=Math.max(r.width,r.height)*2.2;
  d.className="drop";Object.assign(d.style,{left:(e.clientX-r.left)+"px",top:(e.clientY-r.top)+"px",width:s+"px",height:s+"px"});el.appendChild(d);
  d.animate([{transform:"translate(-50%,-50%) scale(0)",opacity:.9},{transform:"translate(-50%,-50%) scale(1)",opacity:0}],{duration:420,easing:"ease-out"}).onfinish=()=>d.remove()}
function draw(){
  if(!D)return;const r=open&&D.recipes.find(x=>x.no===open);
  $("#app").innerHTML=r?detail(r):tab==="pantry"?pantry():tab==="safety"?safety():tab==="saved"?saved():tab==="settings"?settings():tab==="help"?help():tab==="about"?about():list();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",!open&&b.dataset.tab===tab));
  const qi=$("#q");if(qi)qi.oninput=e=>{q=e.target.value;limit=60;$("#list").innerHTML=listHTML()};
  document.querySelectorAll("details.help").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)document.querySelectorAll("details.help").forEach(o=>{if(o!==d)o.open=false})}));
  bubbles();overlay();
}
function go(hash){history.pushState({},"",hash);fromHash();scrollTo(0,0)}
document.addEventListener("click",e=>{
  const k=e.target.closest("[data-open],[data-tab],[data-cat],[data-pc],[data-back],[data-fav],[data-more],[data-theme],[data-gate-ok],[data-gate-again],[data-accept],[data-decline],[data-amm],[data-made],[data-nobanner],[data-showbanner],[data-install],[data-reset]");if(!k)return;const d=k.dataset;
  if(d.gateOk!==undefined){gate="safety";go("#safety");return}
  if(d.gateAgain!==undefined){gate="popup";overlay();return}
  if(d.accept!==undefined){S.accepted=new Date().toISOString();save();gate=null;go("#recipes");return}
  if(d.decline!==undefined){gate="declined";overlay();return}
  if(d.amm){amm=false;if(d.amm==="yes"){S.have=[...new Set([...S.have,"ammonia"])];save();draw()}else overlay();return}
  if(gate&&!d.open&&d.tab!=="safety"&&d.back===undefined)return;
  if(d.open){go("#"+pad(d.open));return}
  if(d.tab){e.preventDefault();if(d.tab==="recipes"&&tab==="recipes"&&!open){cat=null;q=""}if(d.tab==="pantry")pc=null;go("#"+d.tab);return}
  if(d.cat!==undefined){if(d.cat)drop(k,e);cat=d.cat||null;q="";limit=60;setTimeout(()=>{draw();scrollTo(0,0)},d.cat?140:0);return}
  if(d.pc!==undefined){if(d.pc)drop(k,e);pc=d.pc||null;setTimeout(()=>{draw();scrollTo(0,0)},d.pc?140:0);return}
  if(d.more!==undefined){limit+=60;$("#list").innerHTML=listHTML();return}
  if(d.back!==undefined){go("#"+tab);return}
  if(d.theme){S.theme=d.theme;save();applyTheme();document.querySelectorAll(".th").forEach(b=>b.classList.toggle("on",b.dataset.theme===S.theme));bubbles();return}
  if(d.made){const r=D.recipes.find(x=>x.no===+d.made),sv=Math.max(0,r.store-r.cost);S.made={n:(S.made?.n||0)+1,saved:Math.round(((S.made?.saved||0)+sv)*100)/100};save();
    k.textContent=`Added ${usd(sv)} · total ${usd(S.made.saved)}`;k.disabled=true;setTimeout(()=>{k.disabled=false;k.textContent=`I made this · add ${usd(sv)} to my savings`},2200);return}
  if(d.nobanner!==undefined){S.noBanner=true;save();draw();return}
  if(d.showbanner!==undefined){S.noBanner=false;save();go("#recipes");return}
  if(d.install!==undefined){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;draw()})}return}
  if(d.reset!==undefined){if(resetArm){S.made={n:0,saved:0};save();resetArm=false}else{resetArm=true;setTimeout(()=>{resetArm=false;if(tab==="settings")draw()},4000)}draw();return}
  if(d.fav){const n=+d.fav;S.saved=S.saved.includes(n)?S.saved.filter(x=>x!==n):[...S.saved,n];save();draw()}
});
document.addEventListener("change",e=>{const h=e.target.dataset.have;if(!h)return;
  if(h==="ammonia"&&e.target.checked){e.target.checked=false;amm=true;overlay();return}
  S.have=e.target.checked?[...new Set([...S.have,h])]:S.have.filter(x=>x!==h);save();draw()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&amm){amm=false;overlay()}});
const TABS=["recipes","pantry","safety","saved","settings","help","about"];
function fromHash(){let h=location.hash.slice(1);if(h==="menu")h="settings";
  if(gate==="safety"&&h!=="safety"){history.replaceState({},"","#safety");h="safety"}
  if(/^\d{3}$/.test(h)){open=+h}else{open=null;if(TABS.includes(h))tab=h;else if(!h)tab="recipes"}draw()}
addEventListener("popstate",fromHash);addEventListener("resize",()=>{document.querySelectorAll(".bub").forEach(b=>b._p=null);bubbles()});
applyTheme();hydrate();overlay();
fetch("data/recipes.json").then(r=>r.json()).then(j=>{D=j;
  D.recipes.forEach(r=>{r.needs=PANTRY.filter(([k,,re])=>r.ing.some(i=>!/optional/i.test(i)&&re.test(i.toLowerCase()))).map(p=>p[0])});
  S.saved=(S.saved||[]).filter(x=>typeof x==="number");fromHash()}).catch(()=>{$("#app").innerHTML=`<p>Couldn't load recipes. Check your connection and reload.</p>`});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
